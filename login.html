<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master App</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="login-page">
    <div class="page">
        <section class="hero">
            <h1 class="headline">Kelola semua aplikasi Anda dalam <span class="accent">satu pintu.</span></h1>

            <div class="illustration">
                <svg class="connector-lines" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
                    <path d="M270,195 C200,180 150,155 115,125" fill="none" stroke="#c3d6f7" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" />
                    <path d="M270,215 C190,250 150,285 115,308" fill="none" stroke="#c3d6f7" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" />
                    <circle cx="115" cy="125" r="4" fill="var(--blue)" />
                    <circle cx="115" cy="308" r="4" fill="var(--blue)" />
                </svg>
                <div class="float-card fc2">
                    <span class="chip">Master Ekosistem</span>
                    <div class="big-icon">M</div>
                    <div class="line w60"></div>
                    <div class="line"></div>
                    <div class="line w60"></div>
                </div>
                <div class="float-card fc1">
                    <div class="bar"></div>
                    <div class="bar short"></div>
                    <div class="dot-row">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                </div>
                <div class="float-card fc3">
                    <div class="tag">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#c9832b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1.5" />
                            <rect x="14" y="3" width="7" height="7" rx="1.5" />
                            <rect x="3" y="14" width="7" height="7" rx="1.5" />
                            <circle cx="17.5" cy="17.5" r="3.5" />
                        </svg>
                    </div>
                    <div class="line w70"></div>
                    <div class="line"></div>
                </div>
                <div class="badge-avatar">BJ</div>
                <div class="badge-check">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>
                <div class="badge-bell">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                    3 baru
                </div>
            </div>
        </section>

        <section class="form-panel">
            <div class="form-wrap">
                <div class="login-brand">
                    <span class="login-brand-mark">M</span>
                    <span class="login-brand-name">Master<span>App</span></span>
                </div>
                <form>
                    <div class="field"><input type="email" placeholder="Email atau username"></div>
                    <div class="field"><input type="password" placeholder="Kata sandi"></div>
                    <button type="submit" class="btn-primary">Login</button>
                    <a href="#" class="forgot">Lupa kata sandi?</a>
                </form>
            
                <hr class="sep">
            
                <button type="button" class="btn-outline">Buat akun baru</button>
            
                <div class="divider">atau</div>
            
                <button type="button" class="btn-google">
                    <svg viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z" />
                        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.6 0-14.1 4.3-17.7 10.2z" />
                        <path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5.1l-6-5c-2 1.5-4.5 2.4-6.9 2.4-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.8 39.1 16.4 43.5 24 43.5z" />
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.4 5.6l6 5C40.7 35.9 43.5 30.4 43.5 24c0-1.2-.1-2.4-.4-3.5z" />
                    </svg>
                    Login with Google
                </button>
            </div>
        </section>
    </div>
</body>

</html>
