<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Master App - Frontpage</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="front-page">
    <div class="front-container">
        <!-- Floating shapes for background animation -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>

        <div class="front-content">
            <div class="front-hero-section">
                <div class="front-logo-wrapper">
                    <span class="front-logo-mark">
                        <img src="assets/logo-1.png" alt="Master App">
                    </span>
                </div>
                <h1 class="front-title">Master<span>App</span></h1>
                <p class="front-subtitle">Kelola semua aplikasi dalam satu pintu</p>
            </div>
            <div class="front-actions-wrapper">
                <button type="button" id="exploreBtn" class="front-cta-btn" aria-expanded="false" aria-controls="appOrbitContainer">
                    <span>Mulai Eksplorasi</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>

                <div id="appOrbitContainer" class="app-orbit-container" aria-hidden="true">
                    <div class="app-orbit-track">
                        <!-- SIKa -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.05s; --node-color: #737fae;" title="SIKa - Sistem Informasi Karyawan">
                            <span class="orbit-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
                                </svg>
                            </span>
                            <span class="orbit-label">SIKa</span>
                        </a>

                        <!-- Office App -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.1s; --node-color: #6288ed;" title="Office App - Platform Pengelola Dokumen Kerja">
                            <span class="orbit-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="7" width="18" height="13" rx="2" />
                                    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                    <line x1="3" y1="12" x2="21" y2="12" />
                                </svg>
                            </span>
                            <span class="orbit-label">Office App</span>
                        </a>

                        <!-- EAsesmen -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.15s; --node-color: #778be1;" title="EAsesmen - Penilaian Digital">
                            <span class="orbit-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="5" y="4" width="14" height="17" rx="2" />
                                    <path d="M9 3h6v3H9z" />
                                    <path d="m8.5 13 2 2 4-4.5" />
                                </svg>
                            </span>
                            <span class="orbit-label">EAsesmen</span>
                        </a>

                        <!-- Mobilku -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.2s; --node-color: #7898ef;" title="Mobilku - Rental dan Travel">
                            <span class="orbit-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 13l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 7l2 6" />
                                    <rect x="2" y="13" width="20" height="6" rx="2" />
                                    <circle cx="7" cy="19.5" r="1.5" />
                                    <circle cx="17" cy="19.5" r="1.5" />
                                </svg>
                            </span>
                            <span class="orbit-label">Mobilku</span>
                        </a>

                        <!-- GISurvey -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.25s; --node-color: #626b9f;" title="GISurvey - Integrasi PKRMS dan GIS">
                            <span class="orbit-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" />
                                </svg>
                            </span>
                            <span class="orbit-label">GISurvey</span>
                        </a>

                        <!-- Inspirasi Kode -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.3s; --node-color: #637bdc;" title="Inspirasi Kode - Company Profile">
                            <span class="orbit-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
                                </svg>
                            </span>
                            <span class="orbit-label">Inspirasi Kode</span>
                        </a>

                        <!-- Ibadahku -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.35s; --node-color: #6874d3;" title="Ibadahku - Company Profile">
                            <span class="orbit-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
                                </svg>
                            </span>
                            <span class="orbit-label">Ibadahku</span>
                        </a>

                        <!-- PaDi -->
                        <a href="login.html" class="orbit-node" style="--delay: 0.4s; --node-color: #5d70d2;" title="PaDi - Pantau Digital">
                            <span class="orbit-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.429 9.75 2.25 12l4.179 2.25m0-4.5 5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0 4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0-5.571 3-5.571-3" />
                                </svg>
                            </span>
                            <span class="orbit-label">PaDi</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/custom.js"></script>
</body>

</html>
